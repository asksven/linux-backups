# =============================================================================
# docker-backup.conf — per-server configuration template for docker-backup.sh
#
# Copy this file to your CONFIG_DIR (default: /etc/linux-backups/docker-backup.conf)
# and adjust the values for this server. It is sourced by docker-backup.sh as
# plain bash, so quoting and array syntax matter.
#
# Secrets (DEST_URL, SAS_TOKEN, PROM_GTW) are shared with the host backup and
# live in $CONFIG_DIR/secrets.env — they are NOT repeated here.
#
# Tip: run `docker-backup-init.sh` to generate or reconcile this file against the
# stacks actually running on this node.
# =============================================================================

# Logical name for this node. Used as the Prometheus `instance` label and the
# remote blob prefix ($DEST_URL/<NODE_NAME>/docker/<stack>/...). If unset, the
# value from backup.conf (or `hostname -s`) is used.
# NODE_NAME="$(hostname -s)"

# Allowlist of Docker Compose project names to back up. ONLY these stacks are
# backed up. Stacks that own named volumes but are not listed here are detected
# and alerted on (docker_backup_unmanaged_stacks) — never backed up silently.
STACKS=(
  # "immich"
  # "nextcloud"
)

# Local directory where per-stack tarballs are written. Created if missing.
# Defaults to "$BACKUP_DIR/docker" (BACKUP_DIR comes from backup.conf) or
# /var/backups/linux-backups/docker when backup.conf is absent.
# DOCKER_BACKUP_DIR="/var/backups/linux-backups/docker"

# How many days to keep LOCAL stack tarballs before deleting them.
RETENTION_DAYS=7

# How many days to keep REMOTE tarballs. NOTE: not enforced by the script — it is
# enforced server-side by an Azure Blob lifecycle policy on the
# <container>/<node>/docker/ prefix (see lifecycle-policy.example.json).
REMOTE_RETENTION_DAYS=30

# Upload block size in MiB (fewer Azure "Put Block" operations for large tarballs).
BLOCK_SIZE_MB=100

# Grace period (seconds) passed to `docker compose stop` before the stack is
# archived. Give slow databases enough time to shut down cleanly.
STOP_TIMEOUT=30

# Optional: override where per-run logs are written. Defaults to
# "$DOCKER_BACKUP_DIR/logs".
# DOCKER_LOG_DIR="/var/log/linux-backups/docker"

# ---------------------------------------------------------------------------
# BIND_IGNORE — declarative acknowledgment of TRANSIENT bind mounts.
#
# docker-backup.sh backs up named volumes only. It also inspects each stack's
# bind mounts and warns (docker_backup_uncovered_bind_mounts) when a bind source
# is NOT covered by the host-path backup (INCLUDE_PATHS in backup.conf).
#
# Once you have checked a bind mount and confirmed it holds only throwaway data,
# add it here to silence the warning. Each entry is matched (after realpath) as:
#   * an exact path            e.g. "/srv/app/tmp"
#   * a directory subtree      e.g. "/srv/app/cache/"   (trailing slash)
#   * a glob                   e.g. "/srv/*/cache"
# Optionally scope an entry to one stack with a "<stack>:" prefix:
#   e.g. "immich:/data/thumbs-cache"
#
# Document WHY each entry is transient. Entries that match nothing on a run are
# reported as "stale BIND_IGNORE entry" so this list stays honest.
# ---------------------------------------------------------------------------
BIND_IGNORE=(
  # "/srv/app/cache/"                 # regenerated on start, safe to skip
  # "immich:/mnt/thumbs/"             # derived thumbnails, rebuilt from originals
)
