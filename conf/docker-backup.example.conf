# =============================================================================
# docker-backup.conf — per-server configuration template for docker-backup.sh
#
# Copy this file to your CONFIG_DIR (default: /etc/linux-backups/docker-backup.conf)
# and adjust the values for this server. It is sourced by docker-backup.sh as
# plain bash, so quoting and array syntax matter.
#
# Secrets (DEST_URL, SAS_TOKEN, PROM_GTW) are shared with the host backup and
# live in $CONFIG_DIR/secrets.env — they are NOT repeated here.
#
# Tip: run `docker-backup-init.sh` to generate or reconcile this file against the
# stacks actually running on this node.
# =============================================================================

# Logical name for this node. Used as the Prometheus `instance` label and the
# remote blob prefix ($DEST_URL/<NODE_NAME>/docker/<stack>/...). Defaults to
# `hostname -s` when unset.
# NODE_NAME="$(hostname -s)"

# Allowlist of Docker Compose project names to back up. ONLY these stacks are
# backed up. Stacks that own named volumes but are not listed here are detected
# and alerted on (docker_backup_unmanaged_stacks) — never backed up silently.
STACKS=(
  # "immich"
  # "nextcloud"
)

# Local directory where per-stack tarballs are written. Created if missing.
# Defaults to /var/backups/linux-backups/docker when unset.
# DOCKER_BACKUP_DIR="/var/backups/linux-backups/docker"

# When true, archives stay on this host only — no target delivery is attempted
# and none is required. Neither $CONFIG_DIR/targets/ nor secrets.env needs to
# exist. Local retention is still enforced by RETENTION_DAYS below. This is the
# supported mode for a docker-compose-only MVP with no cloud/NAS destination.
# Must be exactly "true" or "false" -- any other value (e.g. a typo) is
# rejected at startup rather than silently treated as remote-delivery mode.
# Without LOCAL_ONLY=true, a missing secrets.env is still a fatal
# misconfiguration. With no secrets.env at all, PROM_GTW is also unset, so
# metrics pushes are skipped -- ship a secrets.env with just PROM_GTW set if
# you want the dashboard populated from a local-only host.
# LOCAL_ONLY=false

# How many days to keep LOCAL stack tarballs before deleting them.
RETENTION_DAYS=7

# How many days to keep REMOTE tarballs. NOTE: not enforced by the script — it is
# enforced server-side by an Azure Blob lifecycle policy on the
# <container>/<node>/docker/ prefix (see lifecycle-policy.example.json).
REMOTE_RETENTION_DAYS=30

# Upload block size in MiB (fewer Azure "Put Block" operations for large tarballs).
BLOCK_SIZE_MB=100

# Grace period (seconds) passed to `docker compose stop` before the stack is
# archived. Give slow databases enough time to shut down cleanly.
STOP_TIMEOUT=30

# ---------------------------------------------------------------------------
# NO_STOP_STACKS — back up these stacks HOT (no downtime): docker-backup.sh
# skips `docker compose stop`/`start` around the archive entirely.
#
# Only safe when the stack cannot write inconsistent state while tar runs: no
# embedded database, no SQLite/WAL files, no long-running writers. When in
# doubt, leave the stack out of this list — the default is always the
# stop-cold-copy archive.
#
# Each entry is an exact Compose project name or a glob, e.g. "static-*".
# Entries that match nothing are reported as "stale NO_STOP_STACKS entry".
# Must stay an indexed array (as declared below), not a plain string.
# ---------------------------------------------------------------------------
NO_STOP_STACKS=(
  # "homepage"   # static dashboard, no writable state worth pausing for
)

# Optional: override where per-run logs are written. Defaults to
# "$DOCKER_BACKUP_DIR/logs".
# DOCKER_LOG_DIR="/var/log/linux-backups/docker"

# ---------------------------------------------------------------------------
# BIND_IGNORE — exclude transient LOCAL bind data from the archive.
#
# docker-backup.sh captures named volumes, compose files, AND local bind-mount
# data into each stack archive. Use BIND_IGNORE to exclude transient or large
# scratch data you do NOT want archived: download queues, caches, transcode
# scratch, etc.
#
# Network/remote filesystems (SMB/CIFS, NFS, fuse.sshfs, …) are auto-excluded
# by fstype — no need to list them here.
#
# Each entry is matched as:
#   * an exact path            e.g. "/mnt/ssd/downloads"
#   * a directory subtree      e.g. "/mnt/ssd/downloads/"  (trailing slash)
#   * a glob                   e.g. "/mnt/*/incomplete"
# Optionally scope an entry to one stack with a "<stack>:" prefix:
#   e.g. "sonarr:/mnt/ssd/downloads"
#
# Run `docker-backup-init.sh` to get BIND_IGNORE suggestions for likely-transient
# or multi-stack bind sources detected on this node.
#
# Entries that match nothing are reported as "stale BIND_IGNORE entry" so
# this list stays honest.
# ---------------------------------------------------------------------------
BIND_IGNORE=(
  # "/mnt/ssd/downloads/complete/"   # transient download scratch; large & shared
  # "immich:/mnt/thumbs/"             # derived thumbnails, rebuilt from originals
)

# ---------------------------------------------------------------------------
# BIND_INCLUDE_NETFS — force-capture a specific network-fs bind mount.
#
# By default docker-backup.sh auto-excludes bind sources on network/remote
# filesystems (cifs, smb2, smb3, nfs, nfs4, fuse.sshfs, fuse.rclone, …) to
# avoid slow, large captures of remote media shares. Add a path here to
# capture it anyway — only useful for small, critical network mounts.
#
# Uses the same matching syntax as BIND_IGNORE (exact / subtree / glob).
# No stack: prefix — entries apply across all stacks.
# ---------------------------------------------------------------------------
# BIND_INCLUDE_NETFS=(
#   # "/mnt/nfs/critical-config"      # small NFS mount; include in archive
# )
