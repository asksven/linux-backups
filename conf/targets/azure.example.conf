# =============================================================================
# azure target — upload the archive to Azure Blob Storage with azcopy.
#
# Copy to $CONFIG_DIR/targets/azure.conf (the filename stem is the target name,
# used as the Prometheus `target` label) and fill in the real values.
#   sudo install -m 600 /dev/null /etc/linux-backups/targets/azure.conf
# NEVER commit the filled-in file (it contains a SAS token).
#
# Sourced by the backup scripts as plain bash.
# =============================================================================

TYPE=azure

# Set to false to keep the file but skip this target.
ENABLED=true

# Container URL WITHOUT the SAS token and WITHOUT a trailing slash.
DEST_URL="https://<account>.blob.core.windows.net/<container>"

# SAS token query string, INCLUDING the leading '?'. Needs Create/Write on the
# container.
SAS_TOKEN="?sv=...&sp=...&sig=..."

# Upload block size in MiB (fewer Azure "Put Block" operations for large tarballs).
BLOCK_SIZE_MB=100

# Retention mode. For azure use 'none': remote retention is enforced server-side
# by an Azure Blob lifecycle policy (see lifecycle-policy.example.json). The
# 'count' mode is NOT supported for azure.
RETENTION_MODE=none
