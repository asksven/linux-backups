# =============================================================================
# rsync target — copy the archive to a remote host over ssh.
#
# Copy to $CONFIG_DIR/targets/<name>.conf (the filename stem is the target name,
# used as the Prometheus `target` label, e.g. "onsite") and fill in.
#   sudo install -m 600 /dev/null /etc/linux-backups/targets/onsite.conf
# NEVER commit the filled-in file.
#
# Prerequisites: key-based ssh from this host to DEST's host, and the base path
# must be writable by that ssh user. Sub-directories (<node>/, <node>/docker/
# <stack>/) are created automatically.
# =============================================================================

TYPE=rsync

# Set to false to keep the file but skip this target.
ENABLED=true

# Destination in rsync/ssh form: user@host:/absolute/base/path
DEST="backup@nas.lan:/srv/backups"

# Optional: ssh private key to authenticate with.
SSH_KEY="/etc/linux-backups/id_rsync"

# Optional: extra ssh options (port, host key policy, ...).
# SSH_OPTS="-p 2222 -o StrictHostKeyChecking=accept-new"

# Optional: rsync bandwidth limit in KiB/s.
# BW_LIMIT=20000

# Retention mode:
#   count — keep only the newest KEEP archives per remote prefix (client-side,
#           pruned over ssh after each successful upload).
#   none  — never prune (the remote side manages retention itself).
RETENTION_MODE=count
KEEP=10
