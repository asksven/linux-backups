# =============================================================================
# linux-backups — per-server configuration template
#
# Copy this file to your CONFIG_DIR (default: /etc/linux-backups/backup.conf)
# and adjust the values for this server. This file is sourced by backup.sh as
# plain bash, so quoting and array syntax matter.
#
# This file (and the whole CONFIG_DIR) is INCLUDED IN THE BACKUP automatically,
# so a node is fully restorable from its tarball.
# =============================================================================

# Logical name for this node. Used as the Prometheus `instance` label and as the
# remote blob prefix ($DEST_URL/<NODE_NAME>/...). Defaults to `hostname -s`.
NODE_NAME="$(hostname -s)"

# Local directory where tarballs are written. Created if missing.
BACKUP_DIR="/var/backups/linux-backups"

# How many days to keep LOCAL tarballs before deleting them.
RETENTION_DAYS=7

# How many days to keep REMOTE tarballs. NOTE: this value is NOT enforced by the
# script — it is enforced server-side by an Azure Blob lifecycle policy. It is
# kept here for documentation and is exported as the `backup_retention_days`
# companion. See README "Remote retention" for the `az` command to apply it.
REMOTE_RETENTION_DAYS=30

# Upload block size in MiB. Larger blocks = fewer Azure "Put Block" write
# operations per upload (cheaper for large tarballs). 100 is a sane default.
BLOCK_SIZE_MB=100

# Optional: where per-run logs are written. Defaults to "$BACKUP_DIR/logs".
# LOG_DIR="/var/log/linux-backups"

# Absolute paths to include in the backup. One entry per array element.
INCLUDE_PATHS=(
  "/etc"
  "/root"
)

# Paths / globs to exclude. Passed to `tar --exclude=`.
EXCLUDE_PATHS=(
  "/etc/ssl/private"
)
