groups:
  - name: linux-backups
    rules:
      # Fires when the most recent backup run reported failure.
      - alert: LinuxBackupFailed
        expr: backup_success{job="linux_backup"} == 0
        for: 5m
        labels:
          severity: critical
          type: backup
        annotations:
          summary: "Backup failed on {{ $labels.instance }}"
          description: >-
            The latest backup run on {{ $labels.instance }} reported failure
            (backup_success=0). Check the last run logs on the host
            (default /var/backups/linux-backups/logs).

      # Fires when no successful backup has completed for over 25h — also catches
      # the case where the scheduled job stopped running entirely.
      - alert: LinuxBackupStale
        expr: time() - backup_last_success_timestamp_seconds{job="linux_backup"} > 90000
        labels:
          severity: critical
          type: backup
        annotations:
          summary: "Backup stale on {{ $labels.instance }}"
          description: >-
            No successful backup on {{ $labels.instance }} for more than 25h.
            The job may be failing or not running at all.

      # Fires when the archive was not delivered to a specific target.
      - alert: LinuxBackupTargetFailed
        expr: backup_target_success{job="linux_backup"} == 0
        for: 5m
        labels:
          severity: critical
          type: backup
        annotations:
          summary: "Backup target failed: {{ $labels.target }} on {{ $labels.instance }}"
          description: >-
            The archive on {{ $labels.instance }} was not delivered to target
            {{ $labels.target }} (backup_target_success=0).

      # Fires when a target has not received a successful delivery for over 25h.
      - alert: LinuxBackupTargetStale
        expr: time() - backup_target_last_success_timestamp_seconds{job="linux_backup"} > 90000
        labels:
          severity: warning
          type: backup
        annotations:
          summary: "Backup target stale: {{ $labels.target }} on {{ $labels.instance }}"
          description: >-
            Target {{ $labels.target }} on {{ $labels.instance }} has not received a
            successful delivery for more than 25h.

  - name: docker-backups
    rules:
      # Fires when the most recent backup of a compose stack reported failure.
      - alert: DockerBackupFailed
        expr: docker_backup_success{job="docker_backup"} == 0
        for: 5m
        labels:
          severity: critical
          type: backup
        annotations:
          summary: "Docker stack backup failed: {{ $labels.stack }} on {{ $labels.instance }}"
          description: >-
            The latest backup of stack {{ $labels.stack }} on {{ $labels.instance }}
            reported failure (docker_backup_success=0). Check the docker-backup logs
            on the host (default /var/backups/linux-backups/docker/logs).

      # Fires when a stack has not been backed up successfully for over 25h.
      - alert: DockerBackupStale
        expr: time() - docker_backup_last_success_timestamp_seconds{job="docker_backup"} > 90000
        labels:
          severity: critical
          type: backup
        annotations:
          summary: "Docker stack backup stale: {{ $labels.stack }} on {{ $labels.instance }}"
          description: >-
            No successful backup of stack {{ $labels.stack }} on {{ $labels.instance }}
            for more than 25h. The job may be failing or not running at all.

      # Fires when a stateful stack is running but not on the backup allowlist.
      - alert: DockerBackupUnmanagedStack
        expr: docker_backup_unmanaged_stacks{job="docker_backup"} > 0
        for: 30m
        labels:
          severity: warning
          type: backup
        annotations:
          summary: "Unmanaged stateful stack(s) on {{ $labels.instance }}"
          description: >-
            {{ $value }} running stack(s) on {{ $labels.instance }} own named volumes
            but are not in the backup allowlist. Run docker-backup-init.sh to add or
            review them.

      # Fires when a stack archive was not delivered to a specific target.
      - alert: DockerBackupTargetFailed
        expr: docker_backup_target_success{job="docker_backup"} == 0
        for: 5m
        labels:
          severity: critical
          type: backup
        annotations:
          summary: "Docker stack target failed: {{ $labels.stack }}/{{ $labels.target }} on {{ $labels.instance }}"
          description: >-
            Stack {{ $labels.stack }} on {{ $labels.instance }} was not delivered to
            target {{ $labels.target }} (docker_backup_target_success=0).
